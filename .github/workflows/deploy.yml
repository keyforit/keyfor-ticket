name: Deploy Key Ticket to Subfolder
on:
  push:
    branches: [ main ]
    paths:
      - 'apps/keyticket/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Build App
      working-directory: apps/keyticket
      run: |
        npm install
        npm run build 

    - name: FTP Deploy to Virtual Directory
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        local-dir: ./apps/keyticket/dist/ 
        server-dir: /site/ticket/
