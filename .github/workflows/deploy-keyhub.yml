name: Deploy KeyHub (Static Web App)

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/keyhub/**'
      - 'services/keyhub-api/**'
      - '.github/workflows/deploy-keyhub.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy KeyHub
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KEYHUB }}
          action: "upload"
          app_location: "apps/keyhub"
          api_location: "services/keyhub-api"
          output_location: "."
          skip_app_build: true
